name: MeteoD ECMWF S2S Settimanali

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Run ECMWF (YYYY-MM-DD; vuoto = ultima emissione disponibile)'
        required: false
        type: string
  schedule:
    # Lunedì -> giovedì; giovedì -> domenica, dopo la finestra di 48h dell'ECDS.
    - cron: '0 14 * * 0,4'

permissions:
  contents: read

concurrency:
  group: meteod-s2s
  cancel-in-progress: false

jobs:
  create-plots:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ECDS_API_KEY: ${{ secrets.ECDS_API_KEY }}
      PYTHONUNBUFFERED: '1'
      MPLBACKEND: Agg
      RUN_DATE: ${{ inputs.run_date }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install ecCodes and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test numerici offline
        run: python tests/test_offline.py
      - name: Validate input assets
        run: python pipeline.py --date "$RUN_DATE" --dry-run
      - name: ECDS -> probabilities -> plots
        run: python pipeline.py --date "$RUN_DATE" --output output
      - name: Upload outputs for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: meteod-s2s-output-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: warn
